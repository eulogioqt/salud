# /etc/nginx/sites-available/salud.eulogioqt.com  (mismo patrón que raquel.eulogioqt.com)
# HTTP: solo ACME + redirección a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name salud.eulogioqt.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: la app (web + API) la sirve el propio servicio salud en 127.0.0.1:7670.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name salud.eulogioqt.com;

    ssl_certificate /etc/letsencrypt/live/salud.eulogioqt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salud.eulogioqt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https://images.openfoodfacts.org; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;

    client_max_body_size 12m;   # fotos de alimentos

    location / {
        proxy_pass http://127.0.0.1:7670;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
