<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<title>Salud · Entrar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f7a5a'/%3E%3Cpath d='M9 17h4l2-5 3 9 2-4h3' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<div class="wrap">
  <form class="card-l" id="f" autocomplete="on">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 32 32"><path d="M7 17h5l2.5-6 3.5 11 2.5-5H25" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Salud</h1>
    <p class="sub">Comida, entreno y peso. ¿Quién eres?</p>
    <div class="who" id="who"></div>
    <div class="field" id="uf"><label class="f" for="u">Usuario</label><input class="input" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label class="f" for="p">Contraseña</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="e"></div>
    <button class="btn primary go" type="submit" id="go">Entrar</button>
    <div class="foot">La sesión se queda guardada en este dispositivo. Para cambiar de cuenta: tu nombre (arriba a la derecha) → Cerrar sesión.</div>
  </form>
</div>
<script src="/login.js"></script>
</body>
</html>
